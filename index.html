<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外旅行 英会話マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom card flip and smooth transition effects */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <header class="bg-indigo-600 dark:bg-slate-800 border-b dark:border-slate-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <i data-lucide="plane-takeoff" class="w-7 h-7 text-yellow-300"></i>
                <h1 class="text-xl font-bold tracking-wide">海外旅行 英会話マスター</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" onclick="toggleDarkMode()" class="p-2 rounded-lg bg-indigo-700/60 dark:bg-slate-700 hover:bg-indigo-700 dark:hover:bg-slate-600 text-white transition flex items-center justify-center" title="ダークモード切替">
                    <i data-lucide="moon" id="theme-toggle-dark-icon" class="w-5 h-5"></i>
                    <i data-lucide="sun" id="theme-toggle-light-icon" class="w-5 h-5 hidden"></i>
                </button>

                <nav class="flex items-center space-x-1 sm:space-x-2 bg-indigo-700/50 dark:bg-slate-900/50 p-1 rounded-xl text-sm">
                    <button id="nav-card" onclick="switchTab('card')" class="px-3 py-1.5 rounded-lg flex items-center space-x-1 transition font-medium bg-white text-indigo-700 shadow-sm">
                        <i data-lucide="layers" class="w-4 h-4"></i>
                        <span>カード</span>
                    </button>
                    <button id="nav-quiz" onclick="switchTab('quiz')" class="px-3 py-1.5 rounded-lg flex items-center space-x-1 transition font-medium hover:bg-indigo-600/50">
                        <i data-lucide="help-circle" class="w-4 h-4"></i>
                        <span>クイズ</span>
                    </button>
                    <button id="nav-list" onclick="switchTab('list')" class="px-3 py-1.5 rounded-lg flex items-center space-x-1 transition font-medium hover:bg-indigo-600/50">
                        <i data-lucide="list" class="w-4 h-4"></i>
                        <span>一覧検索</span>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <section class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-200">
        <div class="max-w-5xl mx-auto px-4 py-2 flex items-center space-x-2 overflow-x-auto custom-scrollbar text-sm" id="category-bar">
            <!-- Dynamic categories generated via JS -->
        </div>
    </section>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col items-center">

        <!-- ==================== FLASHCARD VIEW ==================== -->
        <section id="view-card" class="w-full max-w-2xl flex flex-col items-center space-y-5">
            
            <!-- Controls & Settings Header -->
            <div class="w-full flex justify-between items-center text-sm text-slate-600 dark:text-slate-300 px-1">
                <div class="flex items-center space-x-3">
                    <label class="flex items-center cursor-pointer select-none space-x-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-full shadow-sm">
                        <input type="checkbox" id="toggle-hide-english" onchange="toggleHideEnglish()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-300 dark:bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600 relative"></div>
                        <span class="font-medium text-xs sm:text-sm">日本語のみ優先表示</span>
                    </label>
                </div>

                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-mono" id="card-counter">0 / 0</span>
                    <button onclick="shufflePhrases()" class="p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 shadow-sm transition" title="ランダムシャッフル">
                        <i data-lucide="shuffle" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- The Flashcard -->
            <div id="flashcard" onclick="flipCard()" class="w-full h-80 sm:h-96 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg p-6 sm:p-8 flex flex-col justify-between items-center text-center cursor-pointer transition-all duration-300 hover:shadow-xl relative select-none">
                
                <div class="w-full flex justify-between items-center">
                    <span id="card-category" class="text-xs font-semibold px-3 py-1 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-300 rounded-full border border-indigo-100 dark:border-indigo-800">
                        カテゴリー
                    </span>
                    <button onclick="event.stopPropagation(); toggleBookmarkCurrent()" id="card-bookmark-btn" class="p-2 text-slate-400 dark:text-slate-500 hover:text-yellow-500 dark:hover:text-yellow-400 transition">
                        <i data-lucide="star" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Phrase Display Area -->
                <div class="flex-1 flex flex-col justify-center items-center my-4 space-y-4 w-full">
                    <!-- Japanese Translation -->
                    <div id="card-ja" class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-slate-100 leading-relaxed px-2">
                        日本語訳を表示中...
                    </div>

                    <!-- English Phrase (Revealed or Hidden) -->
                    <div id="card-en-container" class="space-y-3 transition-all duration-300 w-full">
                        <div id="card-en" class="text-lg sm:text-xl font-semibold text-indigo-600 dark:text-indigo-400 tracking-wide">
                            Click / Tap to reveal English
                        </div>
                        <button id="card-audio-btn" onclick="event.stopPropagation(); playCurrentAudio()" class="inline-flex items-center space-x-2 px-4 py-2 bg-indigo-50 dark:bg-indigo-900/40 hover:bg-indigo-100 dark:hover:bg-indigo-900/70 text-indigo-700 dark:text-indigo-300 rounded-full text-sm font-medium transition border border-indigo-200 dark:border-indigo-800 shadow-sm">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                            <span>音声を聞く</span>
                        </button>
                    </div>
                </div>

                <div class="text-xs text-slate-400 dark:text-slate-500 font-medium">
                    <span id="flip-hint">カードをタップして英単語・音声を切替</span>
                </div>
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="w-full flex items-center justify-between gap-3 pt-2">
                <button onclick="prevCard()" class="flex-1 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm transition flex justify-center items-center space-x-1">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    <span>前へ</span>
                </button>

                <button onclick="markStatus('review')" class="px-4 py-3 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 rounded-xl font-medium hover:bg-rose-100 dark:hover:bg-rose-900/60 transition flex items-center space-x-1">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">もう一度</span>
                </button>

                <button onclick="markStatus('mastered')" class="px-4 py-3 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 rounded-xl font-medium hover:bg-emerald-100 dark:hover:bg-emerald-900/60 transition flex items-center space-x-1">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">覚えた</span>
                </button>

                <button onclick="nextCard()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 shadow-md transition flex justify-center items-center space-x-1">
                    <span>次へ</span>
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Speed & Audio Options -->
            <div class="flex items-center space-x-4 text-xs text-slate-500 dark:text-slate-400 pt-2">
                <span>再生速度:</span>
                <button onclick="setSpeed(1.0)" id="speed-10" class="px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium">標準 (1.0x)</button>
                <button onclick="setSpeed(0.8)" id="speed-08" class="px-2.5 py-1 rounded-md bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium">ゆっくり (0.8x)</button>
                <button onclick="setSpeed(0.6)" id="speed-06" class="px-2.5 py-1 rounded-md bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium">かなり遅め (0.6x)</button>
            </div>

        </section>


        <!-- ==================== QUIZ VIEW ==================== -->
        <section id="view-quiz" class="w-full max-w-2xl flex flex-col items-center space-y-6 hidden">
            
            <div class="w-full bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg space-y-6">
                <div class="flex justify-between items-center text-sm font-semibold text-slate-500 dark:text-slate-400">
                    <span id="quiz-category">カテゴリー</span>
                    <span id="quiz-score" class="text-indigo-600 dark:text-indigo-400">Score: 0 / 0</span>
                </div>

                <div class="text-center space-y-2">
                    <span class="text-xs text-indigo-500 dark:text-indigo-400 font-bold uppercase tracking-wider">問題 (日本語訳に合う英語を選ぼう)</span>
                    <h2 id="quiz-question-ja" class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-slate-100">
                        日本語問題文がここに入ります
                    </h2>
                </div>

                <!-- 4 Options -->
                <div id="quiz-options" class="grid grid-cols-1 gap-3">
                    <!-- Option buttons dynamically generated -->
                </div>

                <div id="quiz-feedback" class="hidden p-4 rounded-xl text-center font-bold text-sm transition">
                    <!-- Feedback result -->
                </div>

                <div class="flex justify-end">
                    <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition flex items-center space-x-2">
                        <span>次の問題</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </section>


        <!-- ==================== LIST / SEARCH VIEW ==================== -->
        <section id="view-list" class="w-full flex flex-col space-y-4 hidden">
            
            <!-- Search Filter Bar -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
                <div class="relative w-full sm:w-96">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                    <input type="text" id="search-input" oninput="renderList()" placeholder="英語・日本語・キーワード検索..." class="w-full pl-9 pr-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="flex items-center space-x-2 text-xs text-slate-600 dark:text-slate-400 w-full sm:w-auto justify-end">
                    <span id="list-count" class="font-medium">全 0 件</span>
                </div>
            </div>

            <!-- Phrase List Container -->
            <div id="phrase-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Dynamically populated list items -->
            </div>

        </section>

    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 mt-auto py-4 text-center text-xs text-slate-500 dark:text-slate-400 transition-colors duration-200">
        <p>海外旅行 英会話フレーズ 学習アプリ &copy; 2026</p>
    </footer>

        /* Categories list */
        const CATEGORIES = [
            { id: "ALL", label: "すべて" },
            { id: "FAV", label: "★ お気に入り" },
            { id: "Immigration", label: "入国審査" },
            { id: "Airport", label: "空港" },
            { id: "In-flight", label: "機内" },
            { id: "Hotel", label: "ホテル" },
            { id: "Restaurant", label: "レストラン" },
            { id: "Shopping", label: "買い物" },
            { id: "Directions", label: "交通・道案内" },
            { id: "Spa", label: "スパ" },
            { id: "Trouble", label: "トラブル・会話" }
        ];

        /* App State */
        let currentTab = "card"; // card, quiz, list
        let currentCategory = "ALL";
        let filteredPhrases = [...MASTER_PHRASES];
        let cardIndex = 0;
        let isCardFlipped = false;
        let hideEnglishAlways = false;
        let speechRate = 1.0;
        let isDarkMode = false;
        
        // LocalStorage persisted
        let bookmarks = JSON.parse(localStorage.getItem("phrase_bookmarks") || "[]");
        let phraseStatus = JSON.parse(localStorage.getItem("phrase_status") || "{}"); // { id: 'mastered'|'review' }

        // Quiz State
        let quizScore = 0;
        let quizTotal = 0;
        let currentQuizPhrase = null;

        /* Initialization */
        window.addEventListener("DOMContentLoaded", () => {
            initTheme();
            renderCategoryBar();
            applyCategoryFilter("ALL");
            lucide.createIcons();
            
            // Warm up TTS engine
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        });

        function initTheme() {
            const savedTheme = localStorage.getItem("phrase_app_theme");
            if (savedTheme === "dark" || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setDarkMode(true);
            } else {
                setDarkMode(false);
            }
        }

        function toggleDarkMode() {
            setDarkMode(!isDarkMode);
        }

        function setDarkMode(dark) {
            isDarkMode = dark;
            const darkIcon = document.getElementById("theme-toggle-dark-icon");
            const lightIcon = document.getElementById("theme-toggle-light-icon");

            if (isDarkMode) {
                document.documentElement.classList.add("dark");
                localStorage.setItem("phrase_app_theme", "dark");
                if (darkIcon) darkIcon.classList.add("hidden");
                if (lightIcon) lightIcon.classList.remove("hidden");
            } else {
                document.documentElement.classList.remove("dark");
                localStorage.setItem("phrase_app_theme", "light");
                if (darkIcon) darkIcon.classList.remove("hidden");
                if (lightIcon) lightIcon.classList.add("hidden");
            }
        }

        function renderCategoryBar() {
            const container = document.getElementById("category-bar");
            container.innerHTML = CATEGORIES.map(cat => `
                <button onclick="applyCategoryFilter('${cat.id}')" id="cat-btn-${cat.id}" class="px-3 py-1.5 rounded-full font-medium whitespace-nowrap transition border ${cat.id === currentCategory ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600'}">
                    ${cat.label}
                </button>
            `).join("");
        }

        function applyCategoryFilter(catId) {
            currentCategory = catId;
            renderCategoryBar();

            if (catId === "ALL") {
                filteredPhrases = [...MASTER_PHRASES];
            } else if (catId === "FAV") {
                filteredPhrases = MASTER_PHRASES.filter(p => bookmarks.includes(p.id));
            } else {
                filteredPhrases = MASTER_PHRASES.filter(p => p.cat === catId);
            }

            cardIndex = 0;
            isCardFlipped = false;

            if (currentTab === "card") updateFlashcard();
            if (currentTab === "quiz") setupQuizQuestion();
            if (currentTab === "list") renderList();
        }

        function updateFlashcard() {
            const cardCounter = document.getElementById("card-counter");
            const cardCategory = document.getElementById("card-category");
            const cardJa = document.getElementById("card-ja");
            const cardEnContainer = document.getElementById("card-en-container");
            const cardEn = document.getElementById("card-en");
            const bookmarkBtn = document.getElementById("card-bookmark-btn");

            if (filteredPhrases.length === 0) {
                cardCounter.innerText = "0 / 0";
                cardCategory.innerText = "データなし";
                cardJa.innerText = "該当するフレーズがありません。";
                cardEnContainer.classList.add("hidden");
                return;
            }

            cardEnContainer.classList.remove("hidden");
            cardCounter.innerText = `${cardIndex + 1} / ${filteredPhrases.length}`;

            const item = filteredPhrases[cardIndex];
            
            // Category Label
            const catObj = CATEGORIES.find(c => c.id === item.cat);
            cardCategory.innerText = catObj ? catObj.label : item.cat;

            // Japanese text
            cardJa.innerText = item.ja;

            // Bookmark icon state
            const isBookmarked = bookmarks.includes(item.id);
            bookmarkBtn.innerHTML = `<i data-lucide="star" class="w-6 h-6 ${isBookmarked ? 'fill-yellow-400 text-yellow-400' : 'text-slate-300 dark:text-slate-600'}"></i>`;
            lucide.createIcons();

            // English reveal state
            if (hideEnglishAlways && !isCardFlipped) {
                cardEn.innerText = "タップして英語フレーズを表示";
                cardEn.className = "text-sm text-slate-400 dark:text-slate-500 italic";
            } else {
                cardEn.innerText = item.en;
                cardEn.className = "text-lg sm:text-xl font-semibold text-indigo-600 dark:text-indigo-400 tracking-wide";
            }
        }

        function flipCard() {
            isCardFlipped = !isCardFlipped;
            updateFlashcard();
            
            // If flipped to reveal English, speak it automatically
            if (isCardFlipped && filteredPhrases.length > 0) {
                speakText(filteredPhrases[cardIndex].en);
            }
        }

        function nextCard() {
            if (filteredPhrases.length === 0) return;
            cardIndex = (cardIndex + 1) % filteredPhrases.length;
            isCardFlipped = false;
            updateFlashcard();
        }

        function prevCard() {
            if (filteredPhrases.length === 0) return;
            cardIndex = (cardIndex - 1 + filteredPhrases.length) % filteredPhrases.length;
            isCardFlipped = false;
            updateFlashcard();
        }

        function shufflePhrases() {
            for (let i = filteredPhrases.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredPhrases[i], filteredPhrases[j]] = [filteredPhrases[j], filteredPhrases[i]];
            }
            cardIndex = 0;
            isCardFlipped = false;
            updateFlashcard();
        }

        function toggleHideEnglish() {
            hideEnglishAlways = document.getElementById("toggle-hide-english").checked;
            isCardFlipped = false;
            updateFlashcard();
        }

        function playCurrentAudio() {
            if (filteredPhrases.length > 0) {
                speakText(filteredPhrases[cardIndex].en);
            }
        }

        function toggleBookmarkCurrent() {
            if (filteredPhrases.length === 0) return;
            const item = filteredPhrases[cardIndex];
            if (bookmarks.includes(item.id)) {
                bookmarks = bookmarks.filter(id => id !== item.id);
            } else {
                bookmarks.push(item.id);
            }
            localStorage.setItem("phrase_bookmarks", JSON.stringify(bookmarks));
            updateFlashcard();
        }

        function markStatus(status) {
            if (filteredPhrases.length === 0) return;
            const item = filteredPhrases[cardIndex];
            phraseStatus[item.id] = status;
            localStorage.setItem("phrase_status", JSON.stringify(phraseStatus));
            nextCard();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel(); // Stop ongoing audio

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            utterance.rate = speechRate;

            // Try selecting US/English voice if available
            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith("en"));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function setSpeed(rate) {
            speechRate = rate;
            document.querySelectorAll("[id^='speed-']").forEach(btn => {
                btn.className = "px-2.5 py-1 rounded-md bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium";
            });
            if (rate === 1.0) document.getElementById("speed-10").className = "px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium";
            if (rate === 0.8) document.getElementById("speed-08").className = "px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium";
            if (rate === 0.6) document.getElementById("speed-06").className = "px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium";
        }

        function setupQuizQuestion() {
            if (filteredPhrases.length < 4) {
                document.getElementById("quiz-question-ja").innerText = "クイズを開始するにはカテゴリーを「すべて」にするか、フレーズを増やす必要があります（最低4件）。";
                document.getElementById("quiz-options").innerHTML = "";
                return;
            }

            const feedback = document.getElementById("quiz-feedback");
            const nextBtn = document.getElementById("quiz-next-btn");
            feedback.classList.add("hidden");
            nextBtn.classList.add("hidden");

            // Pick 1 target question
            const randomIndex = Math.floor(Math.random() * filteredPhrases.length);
            currentQuizPhrase = filteredPhrases[randomIndex];

            document.getElementById("quiz-question-ja").innerText = currentQuizPhrase.ja;
            
            const catObj = CATEGORIES.find(c => c.id === currentQuizPhrase.cat);
            document.getElementById("quiz-category").innerText = catObj ? catObj.label : currentQuizPhrase.cat;

            // Create 3 distractors
            let distractors = MASTER_PHRASES.filter(p => p.id !== currentQuizPhrase.id);
            distractors.sort(() => 0.5 - Math.random());
            let choices = [currentQuizPhrase, ...distractors.slice(0, 3)];
            choices.sort(() => 0.5 - Math.random());

            const optionsContainer = document.getElementById("quiz-options");
            optionsContainer.innerHTML = choices.map(choice => `
                <button onclick="checkQuizAnswer(${choice.id === currentQuizPhrase.id}, this, '${choice.en.replace(/'/g, "\\'")}')" class="quiz-opt-btn w-full p-4 border border-slate-200 dark:border-slate-700 rounded-xl text-left hover:border-indigo-500 dark:hover:border-indigo-400 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/50 transition font-medium text-slate-700 dark:text-slate-200 text-sm sm:text-base flex justify-between items-center bg-white dark:bg-slate-800">
                    <span>${choice.en}</span>
                    <i data-lucide="volume-2" class="w-4 h-4 text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400" onclick="event.stopPropagation(); speakText('${choice.en.replace(/'/g, "\\'")}')"></i>
                </button>
            `).join("");

            lucide.createIcons();
        }

        function checkQuizAnswer(isCorrect, element, englishText) {
            speakText(englishText);

            // Disable all options
            const allOpts = document.querySelectorAll(".quiz-opt-btn");
            allOpts.forEach(btn => btn.disabled = true);

            quizTotal++;
            const feedback = document.getElementById("quiz-feedback");
            const nextBtn = document.getElementById("quiz-next-btn");

            if (isCorrect) {
                quizScore++;
                element.classList.add("bg-emerald-100", "dark:bg-emerald-950/80", "border-emerald-500", "text-emerald-800", "dark:text-emerald-200");
                feedback.innerText = "正解です！ Great job!";
                feedback.className = "p-4 rounded-xl text-center font-bold text-sm bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-200 block";
            } else {
                element.classList.add("bg-rose-100", "dark:bg-rose-950/80", "border-rose-500", "text-rose-800", "dark:text-rose-200");
                feedback.innerText = `不正解です。正解: ${currentQuizPhrase.en}`;
                feedback.className = "p-4 rounded-xl text-center font-bold text-sm bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-200 block";
            }

            document.getElementById("quiz-score").innerText = `Score: ${quizScore} / ${quizTotal}`;
            nextBtn.classList.remove("hidden");
        }

        function nextQuizQuestion() {
            setupQuizQuestion();
        }

        function renderList() {
            const query = document.getElementById("search-input").value.toLowerCase().trim();
            const container = document.getElementById("phrase-list");

            let list = filteredPhrases;
            if (query) {
                list = list.filter(p => p.en.toLowerCase().includes(query) || p.ja.includes(query));
            }

            document.getElementById("list-count").innerText = `該当 ${list.length} 件`;

            if (list.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 dark:text-slate-500">フレーズが見つかりませんでした</div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                const isBookmarked = bookmarks.includes(item.id);
                return `
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex justify-between items-start space-x-3 hover:border-indigo-200 dark:hover:border-indigo-600 transition">
                        <div class="space-y-1 flex-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-semibold px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded">
                                    ${item.cat}
                                </span>
                            </div>
                            <div class="font-bold text-slate-800 dark:text-slate-100 text-base">${item.ja}</div>
                            <div class="text-indigo-600 dark:text-indigo-400 font-medium text-sm flex items-center space-x-2">
                                <span>${item.en}</span>
                            </div>
                        </div>

                        <div class="flex items-center space-x-1 pt-1">
                            <button onclick="speakText('${item.en.replace(/'/g, "\\'")}')" class="p-2 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950 rounded-lg transition" title="音声再生">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <button onclick="toggleBookmarkInList(${item.id})" class="p-2 text-slate-300 dark:text-slate-600 hover:text-yellow-500 transition">
                                <i data-lucide="star" class="w-5 h-5 ${isBookmarked ? 'fill-yellow-400 text-yellow-400' : ''}"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join("");

            lucide.createIcons();
        }

        function toggleBookmarkInList(id) {
            if (bookmarks.includes(id)) {
                bookmarks = bookmarks.filter(bId => bId !== id);
            } else {
                bookmarks.push(id);
            }
            localStorage.setItem("phrase_bookmarks", JSON.stringify(bookmarks));
            if (currentCategory === "FAV") applyCategoryFilter("FAV");
            else renderList();
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Tab button styles
            ["card", "quiz", "list"].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = "px-3 py-1.5 rounded-lg flex items-center space-x-1 transition font-medium bg-white text-indigo-700 shadow-sm";
                    view.classList.remove("hidden");
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg flex items-center space-x-1 transition font-medium text-white hover:bg-indigo-600/50 dark:hover:bg-slate-700/50";
                    view.classList.add("hidden");
                }
            });

            if (tab === "card") updateFlashcard();
            if (tab === "quiz") setupQuizQuestion();
            if (tab === "list") renderList();
        }
    </script>
</body>
</html>
